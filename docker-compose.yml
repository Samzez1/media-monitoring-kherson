version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: media-monitoring-postgres
    environment:
      POSTGRES_USER: media_user
      POSTGRES_PASSWORD: media_password
      POSTGRES_DB: media_monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_user -d media_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - media-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: media-monitoring-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - media-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: media-monitoring-backend
    environment:
      DATABASE_URL: postgresql://media_user:media_password@postgres:5432/media_monitoring
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - media-network

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    container_name: media-monitoring-celery-worker
    environment:
      DATABASE_URL: postgresql://media_user:media_password@postgres:5432/media_monitoring
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.parse_feeds worker --loglevel=info --concurrency=4
    networks:
      - media-network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    container_name: media-monitoring-celery-beat
    environment:
      DATABASE_URL: postgresql://media_user:media_password@postgres:5432/media_monitoring
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.parse_feeds beat --loglevel=info
    networks:
      - media-network

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: media-monitoring-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/.next
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - media-network

networks:
  media-network:
    driver: bridge

volumes:
  postgres_data:
